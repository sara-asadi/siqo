<script id="md" type="text/markdown"># گزارش کامل پروژه: بهبود Lero با تعداد صفحه‌های خوانده‌شده

بازه‌ی کار: ۱۸ سپتامبر تا ۷ نوامبر ۲۰۲۶
مخزن: `Proposal/Lero-on-PostgreSQL`، branch `lero-pages-feature`

این گزارش برای کسی نوشته شده که هیچ پیش‌زمینه‌ای از دیتابیس یا یادگیری ماشین ندارد. اگر با مفهومی آشنا هستی، می‌توانی از آن بخش رد شوی.

---

## خلاصه در یک صفحه

**مسئله.** وقتی از دیتابیس سؤالی می‌پرسی، راه‌های زیادی برای پیدا کردن جواب هست و بعضی هزاران برابر کندترند. خود دیتابیس معمولاً راه را با تخمین انتخاب می‌کند و گاهی اشتباه می‌کند. Lero یک مدل یادگیری ماشین است که سعی می‌کند راه بهتر را انتخاب کند.

**ایده‌ی تو.** Lero بر اساس زمان اجرا یاد می‌گیرد، ولی زمان اجرا به حال سیستم بستگی دارد. تو می‌خواهی مدل بر اساس چیزی پایدارتر، یعنی تعداد صفحه‌هایی که از دیتابیس خوانده می‌شود، یاد بگیرد و در برابر تغییرات مقاوم شود.

**کارهای انجام‌شده:**
1. Lero داخل Docker راه افتاد و روی بنچمارک JOB اجرا شد.
2. مدل آماده‌ی Lero با Postgres مقایسه شد. روی سیستم ما Lero **کندتر** از Postgres بود (حدود 0.75 برابر سرعت)، در حالی که مقاله ۷۰٪ کاهش زمان گزارش کرده است.
3. ثبت تعداد صفحه‌ها اضافه شد.
4. **آزمایش ۱:** تخمین تعداد صفحه به ورودی مدل اضافه شد. بهبود قابل اثباتی نداشت.
5. **آزمایش ۲:** مدل «robust» ساخته شد که آمار زنده‌ی جدول‌ها را می‌بیند و تعداد صفحه‌ی واقعی را هم یاد می‌گیرد. کمی بهتر بود، ولی تفاوت در حد نوسان تصادفی است. آزمایش آپدیت داده هم هیچ مدلی را خراب نکرد، پس مقاومت هنوز اثبات نشده است.

**مهم‌ترین یافته‌ها:**
- **ایده‌ی پایداری صفحه با داده تأیید شد.** همان planهای Postgres در دو روز مختلف به‌طور میانه حدود **۲ برابر** زمان متفاوت داشتند، ولی تعداد صفحه‌هایشان **دقیقاً یکسان** بود (بخش ۱۲).
- **یک هشدار برای ایده:** صفحه‌ی کمتر همیشه یعنی سریع‌تر نیست. فقط در حدود ۵۹٪ جفت planها، plan با صفحه‌ی کمتر سریع‌تر بود (بخش ۱۲).
- **یک ایراد در کد Lero پیدا شد:** مدل با اعداد دستکاری‌شده آموزش می‌بیند ولی با اعداد اصلی استفاده می‌شود (بخش ۹.۱).
- **هسته‌ی proposal هنوز تست نشده است:** تغییر چیدمان داده روی دیسک با داده‌ی ثابت (بخش ۸ و ۱۴).

چند خطا در گزارش‌های قبلی‌ام هم پیدا کردم که در **بخش ۱۳** اصلاح شده‌اند.

---

## بخش ۱: مفاهیم پایه‌ی دیتابیس

### ۱.۱ جدول و ردیف
دیتابیس داده را در **جدول** نگه می‌دارد، مثل یک برگه‌ی Excel. هر خط یک **ردیف** (row) است. دیتابیس IMDB ما ۲۱ جدول دارد، مثلاً:

| جدول | چه چیزی نگه می‌دارد | تعداد ردیف |
|---|---|---:|
| `title` | فیلم‌ها | حدود 2.5 میلیون |
| `name` | افراد | حدود 4.2 میلیون |
| `cast_info` | چه کسی در چه فیلمی بوده | حدود 36 میلیون |
| `movie_info` | اطلاعات فیلم‌ها | حدود 15 میلیون |
| `role_type` | انواع نقش | 12 |

### ۱.۲ کوئری (Query)
کوئری سؤالی است که از دیتابیس می‌پرسیم، به زبانی به اسم SQL. مثلاً: «اسم بازیگرانی که در فیلم‌های سال ۲۰۰۰ بازی کرده‌اند».

### ۱.۳ Join
جواب این سؤال در یک جدول نیست. سال فیلم در `title` است، رابطه‌ی فیلم و فرد در `cast_info` و اسم فرد در `name`. باید این جدول‌ها را به هم وصل کرد. به این کار **join** می‌گویند.

### ۱.۴ ترتیب join، و چرا این‌قدر مهم است
فرض کن سه جدول داریم: A و B و C. (این عددها ساختگی‌اند.) می‌توانیم اول A را با B وصل کنیم و بعد نتیجه را با C. یا اول A را با C و بعد با B. **جواب نهایی یکسان است، ولی کار لازم می‌تواند خیلی فرق کند:**

- A با B یک میلیون ردیف میانی می‌سازد، پس باید یک میلیون ردیف را با C مقایسه کنیم.
- A با C فقط ۱۰ ردیف میانی می‌سازد، پس کار بعدی بسیار کم است.

این مثل این است که برای پیدا کردن یک نفر، اول همه‌ی ساکنان شهر را لیست کنی، یا اول فقط ساکنان یک کوچه را. برای همین **ترتیب join مهم‌ترین تصمیم** است. با زیاد شدن جدول‌ها، تعداد ترتیب‌های ممکن به‌شدت زیاد می‌شود.

### ۱.۵ Plan (نقشه‌ی اجرا)
**Plan** دستورالعمل کامل اجرای یک کوئری است: ترتیب join، روش خواندن هر جدول و روش هر join. plan را به شکل درخت نشان می‌دهند. برگ‌ها جدول‌ها هستند و داده از پایین به بالا حرکت می‌کند:

```text
        Hash Join          <-- step 3: join the result with C
        /       \
   Nested Loop   Seq Scan C
    /      \
Seq Scan A  Index Scan B   <-- step 1 and 2: read A, then find matches in B
```

### ۱.۶ روش‌های خواندن یک جدول
- **Seq Scan:** همه‌ی جدول از اول تا آخر خوانده می‌شود، مثل خواندن کل کتاب.
- **Index Scan:** با استفاده از **ایندکس** مستقیم سراغ ردیف‌های لازم می‌رود، مثل فهرست آخر کتاب.
- **Index Only Scan:** جواب از خود ایندکس درمی‌آید، بدون رفتن سراغ جدول.
- **Bitmap Scan:** اول از ایندکس فهرست جاها را می‌سازد و بعد آن‌ها را مرتب می‌خواند. بین دو روش بالاست.

### ۱.۷ روش‌های join
- **Nested Loop:** برای هر ردیف سمت چپ، در سمت راست دنبال جفتش می‌گردد. اگر سمت چپ کوچک باشد عالی است، اگر بزرگ باشد فاجعه.
- **Hash Join:** یک طرف را در حافظه به شکل قابل‌جستجو می‌چیند و طرف دیگر را با آن مقایسه می‌کند. برای داده‌ی زیاد خوب است.
- **Merge Join:** هر دو طرف را مرتب می‌کند و مثل زیپ به هم می‌بندد.

### ۱.۸ Optimizer (بهینه‌ساز)
بخشی از دیتابیس است که قبل از اجرا، بهترین plan را **حدس می‌زند**. چون نمی‌تواند همه‌ی planها را اجرا کند تا بهترین را پیدا کند، هزینه‌ی هر plan را با فرمول تخمین می‌زند و کم‌هزینه‌ترین را انتخاب می‌کند.

### ۱.۹ Cardinality (تعداد ردیف)
**Cardinality** یعنی تعداد ردیفی که یک مرحله تولید می‌کند. optimizer این عدد را **قبل از اجرا تخمین می‌زند**. تخمین از روی **statistics** ساخته می‌شود، یعنی خلاصه‌ای از داده‌ها که با دستور `ANALYZE` جمع می‌شود.

مشکل اصلی همین‌جاست: در joinهای چندجدولی، تخمین می‌تواند هزاران برابر غلط باشد. مثلاً در یکی از کوئری‌های ما (11a) Postgres تخمین زده بود ۱ ردیف و در واقع ۳۱۰ ردیف آمد. وقتی تخمین غلط باشد، optimizer plan بد انتخاب می‌کند.

در این گزارش دو نام را زیاد می‌بینی:
- **`Plan Rows`:** تعداد ردیف **تخمینی**.
- **`Actual Rows`:** تعداد ردیف **واقعی**، که فقط بعد از اجرا معلوم است.

### ۱.۱۰ Page (صفحه)
Postgres داده را تک‌تک ردیف نمی‌خواند. داده در بسته‌های ۸ کیلوبایتی به اسم **page** ذخیره می‌شود. هر بار باید یک صفحه‌ی کامل را بخواند، حتی اگر فقط یک ردیفش را بخواهد. مثل کتابی که باید کل صفحه را باز کنی تا یک خط را بخوانی.

تعداد صفحه‌ها معیار خوبی از **حجم کار** است. مثلاً `cast_info` حدود ۲۵۳ هزار صفحه دارد و `role_type` فقط ۱ صفحه.

### ۱.۱۱ Buffer (حافظه‌ی نهان)
خواندن از دیسک کند است. پس Postgres صفحه‌هایی را که اخیراً خوانده در حافظه نگه می‌دارد. به این فضا **shared buffers** می‌گویند. مثل اینکه کتاب‌های پرمصرف را روی میز نگه داری، نه در کتابخانه.

- **`Shared Hit Blocks`:** صفحه‌هایی که در حافظه بودند (سریع).
- **`Shared Read Blocks`:** صفحه‌هایی که در حافظه‌ی Postgres نبودند.
- **Hit + Read:** کل صفحه‌هایی که plan لمس کرده است.

نکته‌ی مهم: Read لزوماً یعنی دیسک نیست، چون خود سیستم‌عامل هم حافظه‌ی نهان دارد. Hit و Read جداگانه به وضعیت حافظه بستگی دارند، ولی **جمع آن‌ها** برای یک plan ثابت است. این نکته پایه‌ی ایده‌ی توست.

### ۱.۱۲ EXPLAIN
- **`EXPLAIN`:** plan را بدون اجرا نشان می‌دهد، همراه با تخمین‌ها.
- **`EXPLAIN ANALYZE`:** کوئری را واقعاً اجرا می‌کند و عددهای واقعی را هم می‌دهد.
- **`EXPLAIN (ANALYZE, BUFFERS)`:** تعداد صفحه‌ها را هم می‌دهد.

### ۱.۱۳ Layout (چیدمان فیزیکی)
دو جدول می‌توانند داده‌ی یکسان داشته باشند ولی ردیف‌هایشان روی دیسک با ترتیب متفاوت چیده شده باشد. این چیدمان روی تعداد صفحه‌های لازم اثر می‌گذارد. اگر ردیف‌های مرتبط کنار هم باشند، با صفحه‌ی کمتری به آن‌ها می‌رسی. این دقیقاً موضوع proposal توست.

### ۱.۱۴ VACUUM و ANALYZE
- **`ANALYZE`:** statistics را به‌روز می‌کند.
- **`VACUUM FULL`:** جدول را بازنویسی می‌کند و فضای ردیف‌های حذف‌شده را پس می‌گیرد.

## بخش ۲: مفاهیم پایه‌ی یادگیری ماشین

### ۲.۱ مدل
**مدل** برنامه‌ای است که به‌جای قانون‌های دستی، از مثال‌ها یاد می‌گیرد. مثل بچه‌ای که با دیدن عکس‌های زیاد، گربه را از سگ تشخیص می‌دهد.

### ۲.۲ شبکه‌ی عصبی و وزن‌ها
**شبکه‌ی عصبی** نوعی مدل است که میلیون‌ها عدد به اسم **وزن** دارد. یادگیری یعنی تنظیم تدریجی این وزن‌ها تا پیش‌بینی‌ها بهتر شود.

### ۲.۳ Feature و Label
- **Feature (ویژگی):** چیزهایی که مدل به‌عنوان **ورودی** می‌بیند.
- **Label (برچسب):** جواب درستی که مدل باید یاد بگیرد.

در Lero ورودی‌های هر مرحله از plan این‌هاست: نوع عملیات، تعداد ردیف تخمینی، عرض ردیف، و اسم جدول‌ها. برچسب این است که از دو plan کدام سریع‌تر بوده است.

**قانون طلایی:** feature باید در زمان استفاده از مدل در دسترس باشد. برای همین تعداد صفحه‌ی واقعی نمی‌تواند ورودی باشد، چون تا plan اجرا نشود معلوم نیست، و Lero باید قبل از اجرا تصمیم بگیرد.

### ۲.۴ آموزش و استفاده (Training و Inference)
- **Training (آموزش):** مدل با مثال‌های دارای جواب تنظیم می‌شود.
- **Inference (استفاده):** مدل آموزش‌دیده روی ورودی جدید پیش‌بینی می‌کند.

### ۲.۵ داده‌ی آموزش و تست
اگر مدل را روی همان مثال‌هایی بسنجیم که دیده، مثل این است که سؤال‌های امتحان را از قبل به دانش‌آموز بدهیم. برای همین بخشی از داده کنار گذاشته می‌شود تا یادگیری واقعی سنجیده شود.

### ۲.۶ Loss، Epoch و Seed
- **Loss:** عددی که می‌گوید مدل چقدر اشتباه می‌کند. هدف آموزش کم کردن آن است.
- **Epoch:** یک دور کامل مرور همه‌ی داده‌ها. آموزش ما ۱۰۰ epoch دارد.
- **Seed:** عددی که تصادف آموزش را مشخص می‌کند. وزن‌های اولیه و ترتیب داده‌ها تصادفی‌اند. با seed متفاوت، همان کد و همان داده مدل کمی متفاوتی می‌سازد.

برای همین نتیجه‌ی یک seed کافی نیست. اگر بهبودی واقعی باشد باید در اغلب seedها دیده شود.

### ۲.۷ Tree Convolution
plan یک درخت است، پس Lero از شبکه‌ای استفاده می‌کند که روی درخت کار می‌کند. این شبکه در هر گره به خود گره و دو فرزندش نگاه می‌کند و یک خلاصه می‌سازد. در Lero سه لایه پشت سر هم این کار را می‌کنند و خروجی نهایی یک عدد برای کل plan است. عدد کمتر یعنی مدل آن plan را بهتر می‌داند.

### ۲.۸ یادگیری جفتی (Pairwise)
پیش‌بینی زمان دقیق سخت است، ولی لازم هم نیست. برای انتخاب plan کافی است بدانیم از دو plan کدام بهتر است. مثل این است که لازم نیست وزن دقیق دو چمدان را بدانی، فقط باید بدانی کدام سنگین‌تر است. این ایده‌ی اصلی Lero است و `pw` در اسم `imdb_pw` هم از pairwise می‌آید.

### ۲.۹ One-hot و Normalization
- **One-hot:** تبدیل دسته به عدد. مثلاً برای نوع عملیات، یک لیست صفر داریم که فقط خانه‌ی مربوط به آن عملیات ۱ است.
- **Normalization:** بردن عددها به بازه‌ی مشابه، معمولاً ۰ تا ۱، تا عددهای بزرگ بر بقیه غالب نشوند.

### ۲.۱۰ هدف کمکی (Auxiliary Task)
به مدل علاوه بر کار اصلی یک کار جانبی هم می‌دهیم، به این امید که با یاد گرفتن آن، ساختار مسئله را بهتر بفهمد. در آزمایش ۲ کار جانبی «پیش‌بینی تعداد صفحه‌ی واقعی» است. نکته‌ی خوب این است که برچسبش فقط در آموزش لازم است و در زمان استفاده نیازی به آن نیست.

## بخش ۳: معیارهای اندازه‌گیری

### ۳.۱ Latency
زمان اجرای یک کوئری. به cache، بار سیستم و سخت‌افزار بستگی دارد و برای همین نویزی است.

### ۳.۲ Speedup (نسبت سرعت)
`زمان Postgres ÷ زمان مدل`. عدد بزرگ‌تر از ۱ یعنی مدل سریع‌تر است. 0.75x یعنی مدل کندتر است و Postgres در ۷۵٪ زمان مدل کار را تمام می‌کند.

### ۳.۳ زمان کل
جمع زمان همه‌ی کوئری‌ها. چند کوئری سنگین بر این عدد غالب هستند.

### ۳.۴ میانگین هندسی (Geometric Mean)
برای نسبت‌ها مناسب‌تر از میانگین معمولی است. فرض کن یک کوئری ۱۰ برابر سریع‌تر و یکی ۱۰ برابر کندتر شده است:
- میانگین معمولی: `(10 + 0.1) ÷ 2 = 5.05` که می‌گوید پنج برابر بهتر شده، در حالی که بهتر نشده.
- میانگین هندسی: `√(10 × 0.1) = 1` که درست می‌گوید تغییری نکرده.

به این عدد در گزارش‌ها «geomean» هم می‌گویم. وزن همه‌ی کوئری‌ها، سبک و سنگین، در آن برابر است.

### ۳.۵ نویز و p90
نویز یعنی تفاوتی که بدون هیچ تغییری، فقط با اجرای دوباره پیش می‌آید. **p90** یعنی ۹۰٪ مقادیر از این عدد کمتر هستند. «نویز p90 برابر 1.30x» یعنی برای ۹۰٪ کوئری‌ها، دو اجرای یکسان کمتر از 1.30 برابر فرق داشتند. تفاوت کوچک‌تر از نویز را نباید بهبود واقعی حساب کرد.

### ۳.۶ Ablation
حذف یا اضافه کردن اجزا یکی‌یکی، تا معلوم شود هر جزء چقدر سهم دارد.

## بخش ۴: Lero چیست؟

### ۴.۱ ایده
Lero جای optimizer پستگرس را نمی‌گیرد، بلکه از آن استفاده می‌کند. مسیرش سه قدم دارد:

1. **ساختن کاندیدا:** Lero عددهای تخمین cardinality را عمداً تغییر می‌دهد (مثلاً ×۱۰ یا ×۰.۱) و هر بار optimizer را دوباره اجرا می‌کند. با عددهای متفاوت، optimizer ممکن است plan متفاوتی انتخاب کند. این‌طوری چند plan کاندیدا به دست می‌آید.
2. **امتیازدهی:** مدل به هر کاندیدا امتیاز می‌دهد.
3. **انتخاب:** plan با بهترین امتیاز اجرا می‌شود.

```text
Query -> Lero changes estimates -> PostgreSQL planner -> candidate plans
                                                              |
                     run the best plan <- model scores each candidate
```

### ۴.۲ جزئیات ساختن کاندیدا
در `card_picker.py` ضریب‌ها ۰.۰۱، ۰.۱، ۱، ۱۰ و ۱۰۰ هستند. کاندیداها این‌طور ساخته می‌شوند: همه‌ی زیرپرسش‌هایی که **تعداد جدولشان یکسان است** با هم و با یک ضریب تغییر می‌کنند. مثلاً همه‌ی joinهای دوجدولی ×۱۰ می‌شوند. مقاله می‌گوید این انتخاب عمدی است، چون زیرپرسش‌های هم‌اندازه معمولاً با هم و با خطای مشابه کم‌تخمین می‌شوند.

### ۴.۳ آنچه مقاله ادعا می‌کند
- روی IMDB، زمان اجرا **۷۰٪ کمتر** از Postgres.
- مدل ابتدا با **هزینه‌های تخمینی Postgres** پیش‌آموزش می‌بیند و سپس در حین کار، دوره‌ای به‌روز می‌شود (در IMDB هر ۱۰۰ کوئری).
- در تست داده‌ی پویا، روی دیتابیس STATS، داده با گذر زمان **اضافه شد** و مدل هم **هم‌زمان به‌روز می‌شد**.
- سخت‌افزار مقاله: ۹۶ هسته، 512GB حافظه، SSD و `shared_buffers` برابر 4GB.

در مقابل، سیستم ما یک MacBook Air با Docker است و `shared_buffers` برابر 8MB. پس انتظار نتیجه‌ی یکسان نمی‌رود.

### ۴.۴ `imdb_pw`
مدل آماده‌ای که همراه کد Lero منتشر شده است. `imdb` یعنی روی این دیتابیس آموزش دیده و `pw` یعنی روش جفتی. داده‌ی آموزشی‌اش منتشر نشده است، پس نمی‌توانیم آن را با feature جدید دوباره بسازیم.

## بخش ۵: راه‌اندازی و Docker (۱۸ سپتامبر)

### ۵.۱ Docker چیست؟
Docker برنامه را با همه‌ی وابستگی‌هایش در یک محیط جدا اجرا می‌کند. به این محیط **container** می‌گویند. Lero به نسخه‌ی خاصی از Postgres (13.1) با یک تغییر به زبان C (patch) نیاز دارد. با Docker این نسخه‌ی خاص بدون دست زدن به سیستم اصلی نصب می‌شود.

- **`Dockerfile`:** دستور ساختن محیط.
- **`docker-compose.yml`:** تنظیم اجرا، شامل پورت و پوشه‌های مشترک.
- **Volume:** فضای ماندگاری که داده‌ی دیتابیس را نگه می‌دارد.
- **Port:** شماره‌ی درِ ورودی یک سرویس. Postgres ما از بیرون روی `5433` در دسترس است.

### ۵.۲ معماری نهایی

```text
Mac (host)                             Docker container: postgres-lero
+----------------------------+         +--------------------------------+
| server.py (model)  :14567  | <-----> | PostgreSQL 13.1 + Lero patch   |
| test scripts               | ------> | port 5433, database imdb       |
| lero_cards/ (estimate files)| <----> | sees the same folder           |
+----------------------------+         +--------------------------------+
```

مدل روی Mac اجرا می‌شود و Postgres داخل Docker. Postgres برای هر کاندیدا به `server.py` پیام می‌دهد و امتیاز می‌گیرد.

### ۵.۳ JOB Benchmark
**بنچمارک** مجموعه‌ی استاندارد کوئری برای مقایسه‌ی منصفانه است. **JOB** یا Join Order Benchmark روی IMDB ساخته شده و مخصوصاً برای سخت بودن ترتیب join طراحی شده است. ۱۱۳ کوئری تست دارد. مجموعه‌ی آموزش Lero هم حدود هزار کوئری ساخته‌شده از قالب‌های JOB است.

### ۵.۴ مشکلاتی که پیش آمد
| مشکل | توضیح ساده | راه‌حل |
|---|---|---|
| `torch` نصب نبود | کتابخانه‌ی شبکه‌ی عصبی در محیط پایتون نبود | نصب شد |
| `psql` روی Mac نبود | برنامه‌ی اتصال به Postgres روی Mac نصب نبود | اجرای آن از داخل container |
| خطای `unbound variable` | نسخه‌ی قدیمی bash در Mac با آرایه‌ی خالی مشکل دارد | تغییر نوشتار اسکریپت |
| اتصال Postgres به مدل قطع بود | کد C فقط آدرس عددی (IP) می‌فهمد، نه اسم | پیدا کردن IP و دادن آن به تنظیمات |
| کرش حافظه در 29a، 29b و 29c | شرح در پایین | حذف این سه کوئری از تست |

### ۵.۵ کرش حافظه (OOM)
**OOM** یعنی برنامه آن‌قدر حافظه گرفت که سیستم آن را کشت. کوئری‌های 29 هفده جدول دارند. Lero برای هر کاندیدا یک بار کل برنامه‌ریزی را تکرار می‌کند و با `geqo=off` جستجوی ترتیب join کامل انجام می‌شود. حافظه در حدود ۱۲ ثانیه از 472MB به بیش از 11GB رسید. بیشتر کردن حافظه‌ی Docker فقط کرش را چند ثانیه عقب انداخت.

`geqo` روش جایگزین جستجو برای کوئری‌های بزرگ است. روشن کردنش بدتر شد: کرش زودتر، روی 24a، رخ داد و فقط ۵۵ کوئری از ۱۱۲ اجرا شد. مستندات Lero هم `geqo=off` را می‌خواهد، پس همان ماند و تست با ۱۱۰ کوئری انجام شد (`job_excl_29.txt`).

## بخش ۶: اولین بنچمارک، مدل `imdb_pw` در برابر Postgres

**روش:** یک اجرای گرم‌کننده‌ی Postgres که زمانش دور ریخته شد، بعد یک اجرای زمان‌دار Postgres و یک اجرای زمان‌دار Lero، با دیتابیس و تنظیمات یکسان.

| | PostgreSQL | Lero (`imdb_pw`) |
|---|---:|---:|
| زمان اجرای کل | 353.8 s | 487.4 s |
| نسبت سرعت کل | — | 0.73x |
| میانگین هندسی سرعت | — | 0.75x |
| زمان کل برنامه‌ریزی | 2.3 s | 128.7 s |
| plan کاملاً یکسان با Postgres | — | 22 از 110 |
| ترتیب join یکسان با Postgres | — | 30 از 110 |

**معنی:**
- Lero روی این سیستم در مجموع کندتر بود.
- برنامه‌ریزی Lero حدود ۵۶ برابر زمان برد، چون هر کاندیدا یک برنامه‌ریزی کامل و یک تماس با مدل دارد.
- بعضی کوئری‌ها خیلی بهتر شدند (13c حدود ۹ برابر و 31b حدود ۶ برابر).
- بعضی خیلی بدتر شدند (3a حدود ۱۱ برابر و 31c حدود ۷ برابر).
- ضررها حدود ۶ برابر سودها بود: ۴۸.۶ ثانیه در برابر ۸ ثانیه.

### مشکلاتی که در ابزار تست پیدا شد
- **History cache:** ابزار تست نتیجه‌ی plan تکراری را از حافظه برمی‌گرداند و اجرا نمی‌کند. در لاگ اولیه ۶۹ از ۱۱۰ زمان تکراری بود، نه اندازه‌گیری تازه. از آن پس هر اجرا در پوشه‌ی تازه انجام شد.
- **`shared_buffers` برابر 8MB:** فایل تنظیمات کوتاه ما کل تنظیمات را جایگزین کرد و این مقدار کوچک به پیش‌فرض برگشت. برای مقایسه‌ی Lero و Postgres عادلانه است، ولی زمان‌های مطلق را از مقاله دور می‌کند. **این مقدار هنوز هم 8MB است.**
- **بازسازی‌پذیری:** ساخت ایندکس‌ها و `ANALYZE` در اسکریپت بارگذاری نیستند.

خود منطق Lero تغییر نکرده بود، پس مقایسه معتبر است.

## بخش ۷: زیرساختی که برای آزمایش‌ها ساخته شد

### ۷.۱ چرا آموزش آنلاین معمولی استفاده نشد؟
در روش معمول Lero، هر مدل خودش کاندیداهایی را انتخاب می‌کند که اجرا شوند. اگر دو مدل را این‌طور آموزش دهیم، داده‌هایشان فرق می‌کند و نمی‌فهمیم تفاوت از feature است یا از داده. پس یک **داده‌ی مشترک** ساختم. قیمت این انتخاب این است که آموزش ما از روش اصلی ضعیف‌تر است.

### ۷.۲ جمع‌آوری داده
برای هر کوئری آموزشی، سه plan اجرا شد:
- plan خود Postgres
- ۲ کاندیدای تصادفی از Lero

هر اجرا حداکثر ۳۰ ثانیه وقت داشت.

| | تعداد |
|---|---:|
| کوئری آموزشی | 993 |
| plan اجراشده | 2936 |
| plan با اطلاعات BUFFERS | 2825 |
| plan که به سقف ۳۰ ثانیه خورد | 111 |
| گروه قابل استفاده | 926 |
| جفت plan برای آموزش | 2196 |

گروه‌هایی کنار گذاشته شدند که plan متفاوتی نداشتند، یا همه‌شان timeout شده بودند.

جمع‌آوری یک بار سر کوئری ۱۷جدولی q159 با کرش حافظه متوقف شد. ۷ کوئری ۱۷جدولی را حذف کردم و کار از همان‌جا ادامه یافت.

### ۷.۳ پروتکل تست
- **پوشه‌ی تازه برای هر اجرا:** تا history cache دخالت نکند.
- **ترتیب رفت‌وبرگشت:** در آزمایش ۱ مدل‌ها یک بار به ترتیب و یک بار برعکس اجرا شدند، تا تغییر تدریجی وضعیت سیستم روی همه یکسان اثر کند.
- **اجرای ترتیبی:** کوئری‌ها یکی‌یکی اجرا شدند.
- **هم‌زمان نبودن با آموزش:** تست فقط وقتی شروع شد که آموزش تمام شده بود.

## بخش ۸: ایده‌ی proposal

Lero با برچسب latency یاد می‌گیرد، و latency به سخت‌افزار، بار سیستم و cache وابسته است. پیشنهاد تو این است:

1. برچسب به تعداد صفحه‌ی خوانده‌شده تغییر کند.
2. featureهایی درباره‌ی چیدمان فیزیکی داده اضافه شود.
3. آزمایش اصلی: **داده ثابت بماند، چیدمان عوض شود** و نشان دهیم مدل جدید سازگار می‌شود ولی مدل latency نمی‌شود.

**کدام قدم‌ها انجام شده؟**

| قدم | وضعیت |
|---|---|
| ثبت BUFFERS و `track_io_timing` | انجام شد |
| ساختن جدول داده‌ی صفحه و زمان | انجام شد (داده در `train_runs.log`) |
| تحلیل پایداری صفحه | نتیجه‌ی اولیه‌ی مثبت (بخش ۱۲) |
| تحلیل توافق صفحه با latency | نتیجه‌ی اولیه (بخش ۱۲) |
| تغییر برچسب رتبه‌بندی به تعداد صفحه | **انجام نشده** |
| featureهای layout | فقط اندازه‌ی جدول اضافه شد؛ `correlation` و مانند آن نه |
| آزمایش layout-shift | **انجام نشده** |

توجه کن کاری که در این جلسه‌ها کردیم با آن برنامه کمی فرق دارد. به درخواست تو feature و هدف کمکی اضافه شد و برچسب رتبه‌بندی همچنان latency است.

## بخش ۹: ایرادهای Lero که بررسی شد

### ۹.۱ ناهمخوانی بین آموزش و استفاده (مهم‌ترین)
یادت هست Lero برای ساختن کاندیدا عددهای تخمین را دستکاری می‌کند؟ حالا ببین بعدش چه می‌شود:

- **در زمان استفاده:** قبل از امتیازدهی، سرور `Plan Rows` همه‌ی کاندیداها را به **عدد اصلی Postgres** برمی‌گرداند (`PlanCardReplacer` در `lero/utils.py`). این کار منطقی است، چون عددهای دستکاری‌شده ساختگی‌اند. ولی مدل دیگر نمی‌داند هر plan از کدام فرض آمده است. **این همان اطلاعاتی است که دور ریخته می‌شود.**
- **در زمان آموزش:** کاندیداها با عددهای دستکاری‌شده اجرا می‌شوند و plan با **همان عددهای دستکاری‌شده** وارد داده‌ی آموزشی می‌شود. این برگرداندن انجام نمی‌شود.

پس مدل با یک نوع ورودی آموزش می‌بیند و با نوع دیگری کار می‌کند. مثل اینکه کسی را با نقشه‌ی یک شهر آموزش دهی و امتحان را با نقشه‌ی شهر دیگری بگیری.

**اندازه‌گیری:** دست‌کم ۴۸۲ کاندیدا از ۱۹۴۳ کاندیدای داده‌ی ما، روی زیرپرسش‌های مشترک با plan خود Postgres، تخمینی بیش از ۳ برابر متفاوت دارند. مثلاً یک زیرپرسش دوجدولی از 2865 به 286500 رسیده است. عدد واقعی بیشتر است، چون فقط زیرپرسش‌های مشترک قابل مقایسه بودند.

این رفتار در کد اصلی Lero هم هست (`train_model.py`). مقاله درباره‌اش چیزی نمی‌گوید. اینکه چقدر به کیفیت مدل آسیب می‌زند **هنوز اندازه‌گیری نشده** است.

### ۹.۲ آن چیزی که یادت بود: دور ریختن ترتیب join
گفتی Lero اگر plan دیگری مثل A⋈C⋈B به‌جای A⋈B⋈C داشته باشد، آن را دور می‌ریزد. آن گفتگو را در سه گفتگوی ذخیره‌شده‌ی این پروژه پیدا نکردم، پس کد و داده را مستقیم بررسی کردم:

- **Lero ترتیب join متفاوت را دور نمی‌ریزد.** روی ۳۷ کوئری تست، در ۳۶ کوئری کاندیداهایی با ترتیب join متفاوت از Postgres ساخته شد. مقاله هم تنوع ترتیب join را هدف می‌داند.
- **ولی ترتیب‌هایی که ساخته می‌شوند محدودند.** چون همه‌ی زیرپرسش‌های هم‌اندازه با یک ضریب تغییر می‌کنند، نسبت تخمین A⋈B به A⋈C در یک کاندیدا عوض نمی‌شود. اگر خطای اصلی Postgres این باشد که A⋈B را کم و A⋈C را درست تخمین زده، این خطا مستقیم اصلاح نمی‌شود. فرض مقاله این است که خطاهای هم‌اندازه معمولاً مشابه‌اند.
- **تعداد کاندیدا کم است:** میانه ۹ کاندیدا و ۷ ترتیب join متمایز برای هر کوئری، و حداکثر ۲۳ کاندیدا. برای یک join چهارده‌جدولی این بخش کوچکی از فضای ممکن است.

اثر این محدودیت روی کیفیت plan نهایی را اندازه نگرفتم. اگر این موضوع برای proposal مهم است، می‌شود یک آزمایش جدا برایش طراحی کرد: تغییر مستقل هر زیرپرسش و دیدن اینکه چه planهای بهتری پیدا می‌شود.

### ۹.۳ حذف تکراری‌ها با امضای ناقص
`get_tree_signature` برای تشخیص plan تکراری فقط نوع join و اسم جدول را می‌بیند، نه روش خواندن جدول را. پس دو plan که فقط در Index Scan و Seq Scan فرق دارند تکراری حساب می‌شوند و یکی از لیست کاندیداهای آموزشی حذف می‌شود.

### ۹.۴ featureهای شکننده
- **اسم جدول به‌صورت one-hot:** مدل ممکن است «جدول X گران است» را حفظ کند، نه دلیلش را.
- **Normalization ثابت:** بازه‌ها از داده‌ی آموزشی گرفته می‌شوند.
- **بی‌خبری از فیزیک داده:** اندازه و چیدمان جدول در ورودی نیست.

### ۹.۵ هزینه و پایداری
برنامه‌ریزی چند ده برابر کندتر است (128.7 در برابر 2.3 ثانیه) و کوئری‌های ۱۷جدولی کرش می‌کنند.

### ۹.۶ برچسب نویزی
برچسب latency نویزی است (بخش ۱۲).

### ۹.۷ برگرداندن cardinality اصلی: plan حذف نمی‌شود
`PlanCardReplacer` عدد اصلی هر join را با کلید «مجموعه‌ی جدول‌ها» پیدا می‌کند. اگر کلید پیدا نشود خطای `Unknown tag` می‌دهد. طبق کد C این خطا کل کوئری را fail می‌کند، نه فقط یک plan را. چنین خطایی در لاگ `imdb_upd` (۵ پاس Lero) صفر بار دیده شد و جمع‌آوری داده هم بعد از حذف کوئری‌های ۱۷جدولی شکستی نداشت. دلیلش این است که Postgres همه‌ی زیرمجموعه‌های قابل join را از قبل می‌سازد، پس ترتیب join جدید هم کلیدش را دارد.

### ۹.۸ برخورد کلیدها در self-join
کلید با **اسم جدول** ساخته می‌شود، نه alias. اگر کوئری یک جدول را دو بار داشته باشد (مثل `t1` و `t2`)، زیرپرسش‌های متفاوتی می‌توانند کلید یکسان بگیرند و کد فقط عدد اولی را نگه می‌دارد. پس به بعضی joinها **عدد زیرپرسش دیگری** داده می‌شود. در ۱۰ کوئری از ۸۸ کوئری متمایز لاگ این اتفاق با اختلاف بیش از ۱.۵ برابر افتاد، و بدترین اختلاف حدود ۲۳۵ هزار برابر بود.

### ۹.۹ کاندیدای اجراشده همیشه همان کاندیدای امتیازگرفته نیست
در زمان امتیازدهی cardinality با hook داخل Postgres تغییر می‌کند و در اجرای آموزشی با card file. این دو مسیر یکسان نیستند. در ۹ کوئری از ۳۷ کوئری بررسی‌شده، بعضی کاندیداهایی که امضای متفاوت داشتند بعد از بازسازی با card file به plan یکسان رسیدند (۱۴ کاندیدا در مجموع). پس بازسازی همیشه plan اصلی را نمی‌سازد. دو علت محتمل، که تأیید نشده‌اند: شمارنده‌ی `join_est_no` با فراخوانی‌های دیگر `calc_joinrel_size_estimate` جابه‌جا می‌شود، و مسیر card file عدد را به حداقل ۱ می‌رساند ولی hook نه.

### ۹.۱۰ صفر شدن cardinality
`card_picker.py` حاصل ضرب را با `int()` قطع می‌کند. پس هر تخمین کمتر از ۱۰ با ضریب ۰.۱، و هر تخمین کمتر از ۱۰۰ با ضریب ۰.۰۱، صفر می‌شود. ۵۷٪ زیرپرسش‌های لاگ کمتر از ۱۰۰ هستند. صفر بودن cardinality هزینه‌ها را در برنامه‌ریزی بی‌معنی می‌کند. اثرش را روی کیفیت کاندیداها اندازه نگرفته‌ام.

### ۹.۱۱ تخمین تک‌جدولی هیچ‌وقت تغییر نمی‌کند
hook فقط روی joinها کار می‌کند و `card_picker.py` تا سطح ۲ جدول پایین می‌آید. مقاله از k≥1 حرف می‌زند، ولی در این کد خطای تخمین یک جدول تنها هرگز بررسی نمی‌شود.

## بخش ۱۰: آزمایش ۱، تخمین تعداد صفحه به‌عنوان ورودی

### سؤال
اگر تعداد صفحه‌ی تخمینی را به ورودی مدل اضافه کنیم، plan بهتری انتخاب می‌کند؟

### طراحی
تعداد واقعی قبل از اجرا معلوم نیست، پس تخمین زدم:

| گره | فرمول تخمین |
|---|---|
| Seq Scan | تعداد صفحه‌های جدول |
| Index Scan | کمترِ (صفحه‌های جدول، ردیف‌ها) + ۲ صفحه برای ایندکس |
| Nested Loop | صفحه‌های سمت چپ + (ردیف‌های سمت چپ × صفحه‌های سمت راست) |
| بقیه | جمع فرزندان |

`relpages` تعداد صفحه‌های جدول است و قبل از اجرا معلوم است. بررسی روی دو کوئری نشان داد تخمین وقتی ردیف‌ها درست باشند در کل plan در حد ۱.۵ تا ۱.۷ برابر عدد واقعی است، ولی با ردیف‌های تخمینی می‌تواند خیلی دورتر شود. مثلاً در 11a، 1.5 هزار در برابر 62 هزار.

### نتیجه
تست روی ۱۱۰ کوئری، میانگین ۲ اجرا:

| مدل | زمان کل | میانگین هندسی نسبت به PG | صفحه‌ی لمس‌شده |
|---|---:|---:|---:|
| PostgreSQL | 337 s | 1.00x | 208M |
| Lero اصلی، seed 0 | 659 s | 0.49x | 384M |
| Lero اصلی، seed 1 | 499 s | 0.68x | 373M |
| Lero + صفحه، seed 0 | 521 s | 0.64x | 283M |
| Lero + صفحه، seed 1 | 524 s | 0.64x | 409M |
| `imdb_pw` | 458 s | 0.73x | 215M |

### تفسیر
- با seed 0 نسخه‌ی صفحه ۱.۳۱ برابر بهتر بود و با seed 1 کمی بدتر.
- عوض کردن seed به‌تنهایی Lero اصلی را از 0.49x به 0.68x برد، یعنی بیشتر از اثر feature.
- نسخه‌ی صفحه با هر دو seed 0.64x بود، که شاید نشانه‌ی پایداری باشد. با ۲ seed نمی‌شود چنین نتیجه‌ای گرفت.
- **جمع‌بندی:** بهبود قابل اثباتی ندارد. دلیل احتمالی این است که تخمین از همان `Plan Rows` ساخته می‌شود که مدل از قبل دارد.

**یک نقص در این آزمایش:** به‌خاطر ایراد ۹.۱، تخمین صفحه هم در آموزش از عددهای دستکاری‌شده ساخته شده است. این ممکن است نتیجه را به زیان این feature تحت تأثیر قرار داده باشد.

## بخش ۱۱: آزمایش ۲، مدل robust و آپدیت داده

### سؤال
آیا مدلی که اندازه‌ی جدول‌ها را زنده می‌بیند و تعداد صفحه‌ی واقعی را یاد می‌گیرد، در برابر تغییر داده مقاوم‌تر است؟

### طراحی مدل
دو جزء جدید اضافه شد:

**۱. هدف کمکی صفحه (`--aux_pages`).** مدل علاوه بر مقایسه‌ی planها، تعداد صفحه‌ی واقعی را هم پیش‌بینی می‌کند: برای هر گره صفحه‌های خودش، و برای کل plan جمع صفحه‌ها. برچسب از BUFFERS می‌آید. loss کل این است:

`loss کل = loss رتبه‌بندی + λ × خطای پیش‌بینی صفحه`

در آزمایش ما λ برابر ۱ است.

**۲. ورودی‌های مقاوم (`--robust`).**
- `relpages`، `reltuples` و تعداد ردیف در هر صفحه به‌صورت **زنده** از دیتابیس خوانده می‌شود، پس بعد از آپدیت خودبه‌خود عوض می‌شود.
- one-hot اسم جدول حذف شد، تا مدل مجبور شود به‌جای اسم، به اندازه تکیه کند.
- مقیاس عددها ثابت است، نه وابسته به داده‌ی آموزشی.

### Ablation آفلاین
**روش:** از ۹۲۶ گروه، ۸۰٪ برای آموزش و ۱۸۶ کوئری برای سنجش کنار گذاشته شد. چون همه‌ی کاندیداهای این کوئری‌ها اجرا شده‌اند، می‌توان بدون اجرای جدید دید مدل کدام را انتخاب می‌کرد.

| نسخه | چه چیزی اضافه شده | دقت در مقایسه‌ی دو plan | زمان کل انتخاب‌ها | خطای پیش‌بینی صفحه |
|---|---|---:|---:|---:|
| `base` | هیچ | 70.2% | 339.9 s | — |
| `pages` | تخمین صفحه | 72.4% | 339.8 s | — |
| `auxonly` | هدف کمکی صفحه | 69.2% | 348.5 s | 3.2 تا 4.7 برابر |
| `robustnoaux` | ورودی‌های مقاوم | 73.0% | 352.7 s | — |
| `robust` | هر دو | 73.8% | 327.1 s | 3.0 تا 4.0 برابر |

مرجع: مجموع plan خود Postgres 414.7 ثانیه و بهترین کاندیدای ممکن 281.0 ثانیه است.

**تفسیر:**
- `robust` در هر دو معیار اول بود و هر دو seedش از هر دو seed `base` دقت بالاتری داشتند.
- هدف کمکی به‌تنهایی کمی بدتر از `base` بود. هر جزء به‌تنهایی هر دو معیار را بهتر نکرد.
- پیش‌بینی صفحه هنوز ضعیف است، حدود ۳ تا ۴ برابر خطا دارد.

**هشدار مهم:** در این جدول همه‌ی مدل‌ها از Postgres سریع‌ترند، ولی این **با تست واقعی قابل مقایسه نیست** (بخش ۱۳، مورد ۱). این جدول فقط برای مقایسه‌ی نسخه‌ها با هم مفید است.

### سناریوی آپدیت داده
از یک کپی از دیتابیس به اسم `imdb_upd`، همه‌ی فیلم‌های بعد از ۲۰۰۵ و ردیف‌های مرتبطشان حذف شد و بعد `VACUUM FULL` و `ANALYZE` اجرا شد.

| جدول | ردیف قبل | ردیف بعد | تغییر |
|---|---:|---:|---:|
| `cast_info` | 36.3M | 20.3M | −44% |
| `title` | 2.53M | 1.52M | −40% |
| `movie_info` | 15.4M | 9.9M | −36% |
| `movie_keyword` | 4.5M | 3.3M | −28% |

حجم دیتابیس از 8.7GB به 5.8GB رسید. مدل‌ها روی `imdb` آموزش دیدند و **بدون آموزش دوباره** روی هر دو دیتابیس تست شدند.

### نتیجه
هر مدل روی هر دیتابیس یک بار اجرا شد. هر عدد نسبت به Postgres روی همان دیتابیس است.

| مدل | روی imdb | روی imdb_upd | نسبت بعد به قبل | کوئری‌های بیش از ۲ برابر کندتر از PG |
|---|---:|---:|---:|---:|
| Lero اصلی (`base`، میانگین ۲ seed) | 0.68x | 0.70x | 1.03 | 25.5 ← 26 |
| Lero robust (میانگین ۲ seed) | 0.73x | 0.73x | 1.00 | 21.5 ← 22.5 |
| `imdb_pw` | 0.74x | 0.74x | 0.99 | 29 ← 26 |

جزئیات هر seed:

| مدل | imdb: seed 0 | imdb: seed 1 | imdb_upd: seed 0 | imdb_upd: seed 1 |
|---|---:|---:|---:|---:|
| `base` | 0.61x | 0.75x | 0.64x | 0.75x |
| `robust` | 0.77x | 0.68x | 0.76x | 0.70x |

### تفسیر
- **هیچ مدلی بعد از آپدیت افت نکرد.** نسبت بعد به قبل برای همه حدود ۱ است. پس نمی‌توان گفت مدل robust مقاوم‌تر است، چون مدل پایه هم خراب نشد.
- **چرا افت نکرد؟** حدس من این است که حذف یک بازه‌ی زمانی، جدول‌ها را تقریباً متناسب کوچک می‌کند و planهای خوب همان خوب می‌مانند. ضمن این‌که Postgres با `ANALYZE` آمار جدید را به همه‌ی مدل‌ها می‌دهد. این توضیح را جداگانه تست نکرده‌ام.
- **robust کمی بهتر بود** ولی seedهای دو مدل هم‌پوشانی دارند، پس تفاوت قابل اثبات نیست.
- `imdb_pw` همچنان بهترین یا هم‌سطح بهترین است و همه از Postgres کندترند.
- مقاله هم تست داده‌ی پویا را با **اضافه شدن داده و به‌روزرسانی هم‌زمان مدل** انجام داده، پس با آزمایش ما مستقیم قابل مقایسه نیست.

## بخش ۱۲: یافته‌های جدید درباره‌ی صفحه و latency

این دو تحلیل را هنگام نوشتن همین گزارش روی داده‌ی موجود انجام دادم.

### پایداری: تأیید قوی ایده‌ی تو
همان ۱۱۰ plan خود Postgres را در سه اجرا مقایسه کردم:

| مقایسه | نسبت latency (میانه) | نسبت latency (p90) | نسبت صفحه (Hit + Read) |
|---|---:|---:|---:|
| دو اجرای یک نوبت | 1.13 | 1.29 | **1.0000** |
| دو اجرا در روزهای مختلف | 1.96 | 2.37 | **1.0000** |

زمان کل همین planها در سه اجرا 355، 319 و 180 ثانیه بود، ولی تعداد صفحه هر بار دقیقاً یکی بود. دلیل تفاوت ۲ برابری بین روزها را نمی‌دانم و بررسی نکرده‌ام. همین اتفاق برای مدل‌ها هم افتاد: `base_s0` در یک نوبت 659 ثانیه و در نوبت دیگر 293 ثانیه طول کشید، با 383.9M صفحه در هر دو.

این یافته برای بخش انگیزه‌ی proposal بسیار قوی است: **latency یک plan تا دو برابر عوض می‌شود، ولی صفحه‌ها ثابت می‌مانند.**

### توافق: یک هشدار
در ۲۱۹۰ جفت plan از یک کوئری (بدون timeout) پرسیدم: آیا plan با صفحه‌ی کمتر سریع‌تر هم بوده؟

**بله، در ۵۹.۳٪ موارد.** این کمی بهتر از شیر یا خط است و کافی نیست که بگوییم صفحه کاملاً جای زمان را می‌گیرد. دلایل احتمالی:
- صفحه‌ی داخل حافظه و صفحه‌ی روی دیسک در این شمارش یکسانند.
- CPU مصرف‌شده برای join و مرتب‌سازی در صفحه دیده نمی‌شود.
- بسیاری از جفت‌ها تفاوت کوچکی دارند، و در 8MB `shared_buffers` شرایط خاص است.

این عدد تحلیل کامل نیست. proposal باید جدی با آن روبه‌رو شود، چون اگر برچسب را به صفحه تغییر دهیم، مدل ممکن است planی با صفحه‌ی کمتر ولی زمان بیشتر انتخاب کند. تحلیل دقیق‌تر با Kendall's tau و جدا کردن Hit و Read، قدم بعدی است.

## بخش ۱۳: اصلاح خطاهای گزارش‌های قبلی

موقع بازنویسی، این موارد را در حرف‌های قبلی خودم اشتباه یا زیادی قطعی دیدم:

1. **«همه‌ی مدل‌ها در تست آفلاین از Postgres بهترند» گمراه‌کننده بود.** تست آفلاین 1.55x و تست واقعی حدود 0.7x نشان داد. تست آفلاین فقط بین ۳ plan انتخاب می‌کند و plan کاندیداها هنوز عددهای دستکاری‌شده را دارند، در حالی که در استفاده‌ی واقعی این عددها برگردانده می‌شوند. کوئری‌هایش هم با مجموعه‌ی تست فرق دارند. پس آن عدد را نباید به‌عنوان عملکرد واقعی خواند.
2. **«تخمین صفحه روی هر گره تا ۱.۵ برابر درست است» درست نبود.** من فقط دو کوئری را دیدم. در سطح کل plan خطا ۱.۵ تا ۱.۷ برابر بود، ولی در بعضی گره‌ها تا چند برابر، مثلاً ۳ تا ۶ برابر.
3. **«هر ۷ کوئری ۱۷جدولی کرش می‌کنند» زیادی قطعی بود.** کرش فقط روی q159 دیده شد و ۶ کوئری دیگر را احتیاطی حذف کردم.
4. **توقف اول را اول به پاک شدن پوشه‌ی موقت نسبت دادم** که اشتباه بود. علت کرش حافظه بود. کند بودن عجیب آن اجرا (۱۶۰ کوئری در حدود چند روز) هم توضیح قطعی ندارد و احتمالاً به خواب رفتن Mac مربوط است.
5. **نویز را کم گفتم.** عدد 1.30x مربوط به یک نوبت است. بین روزها نوسان تا حدود ۲ برابر است، پس عددهای جدول‌های مختلف این گزارش را نباید مستقیم با هم مقایسه کرد؛ فقط مقایسه‌ی داخل یک نوبت معتبر است.
6. **علت کرش حافظه اثبات نشده است.** در جلسه‌ی اول گفتم هر ترتیب join یک تماس شبکه با مدل دارد. کد نشان می‌دهد تماس به‌ازای هر کاندیدا است، نه هر ترتیب join. توضیح آن جلسه درباره‌ی بدتر شدن با `geqo=on` هم بر همین پایه بود و تأیید نشده است.
7. **تعداد plan با BUFFERS** را قبلاً حدود ۲۷۰۰ گفتم. عدد درست 2825 است.

## بخش ۱۴: محدودیت‌ها و قدم‌های بعدی

### چرا مدل‌های ما از Postgres ضعیف‌ترند؟
چند دلیل محتمل، که هیچ‌کدام جداگانه اندازه‌گیری نشده است:
- **پیش‌آموزش نداریم.** مقاله مدل را ابتدا با هزینه‌های تخمینی Postgres آموزش می‌دهد تا از همان اول شبیه Postgres عمل کند. ما از صفر شروع کردیم. این شاید مهم‌ترین تفاوت باشد.
- **داده‌ی کم:** ۲۱۹۶ جفت plan از یک دور.
- **ایراد ۹.۱:** ناهمخوانی آموزش و استفاده.
- **تفاوت محیط:** سخت‌افزار و `shared_buffers`.

### پیشنهاد ترتیب کار
1. **تحلیل کامل پایداری و توافق** روی داده‌ی موجود. اجرای جدید نمی‌خواهد و نمودارهای اصلی proposal را می‌دهد.
2. **تثبیت `shared_buffers`** روی مقداری معقول، قبل از هر جمع‌آوری تازه.
3. **رفع ایراد ۹.۱** تا آموزش و استفاده هماهنگ شوند.
4. **افزودن پیش‌آموزش** تا مدل‌ها دست‌کم هم‌سطح Postgres شروع کنند.
5. **تغییر برچسب به تعداد صفحه** که هدف اصلی proposal است، و سنجیدن آن با توجه به هشدار ۵۹٪.
6. **آزمایش layout-shift:** داده ثابت، چیدمان تغییر با `CLUSTER`، بارگذاری تصادفی و bloat، به‌همراه featureهایی مثل `pg_stats.correlation`.
7. **آزمایش محکم‌تر:** ۴ تا ۵ seed و چند اجرا در یک نوبت.
