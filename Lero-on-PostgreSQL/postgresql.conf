listen_addresses = '*'
geqo = off
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
track_io_timing = on
# Benchmark cache sizing (Docker VM has ~7.75GB; imdb is ~8.7GB incl. indexes).
# 8MB (the default) made almost every page a "read" served by the OS cache.
# The planner does not use shared_buffers, so plans are unchanged by this.
shared_buffers = 2GB
