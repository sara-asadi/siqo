services:
  postgres-siqo:
    image: postgres:16
    container_name: postgres-siqo
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata_siqo:/var/lib/postgresql/data
      - ./siqo.conf:/etc/postgresql/postgresql.conf
    
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf"
      ]

    restart: unless-stopped
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin 
    ports:
      - "8080:80"

volumes:
  pgdata_siqo: